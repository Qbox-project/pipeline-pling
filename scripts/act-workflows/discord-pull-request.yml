# act-only: default inputs scenario for pull requests (base branch never used in CI)
name: Discord Pull Request Notification

on:
  pull_request_target:
    types: [opened, closed]
    branches: [__act_only_pull_request__]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Discord
        # Retained as a second layer in case this file is ever moved back under
        # .github/workflows. act sets ACT=true; the env context is only
        # available to step-level conditions.
        if: ${{ env.ACT == 'true' }}
        uses: ./
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          thread-id: ${{ vars.DISCORD_THREAD_ID }}
