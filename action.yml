name: Pipeline Pling
author: Qbox Project
description: Send clear, customizable GitHub activity notifications to Discord.
branding:
  icon: bell
  color: yellow

inputs:
  webhook-url:
    description: Default Discord webhook URL used to send notifications.
    required: true
  thread-id:
    description: Default Discord forum thread ID to post into.
    required: false
  pull-request-webhook-url:
    description: Discord webhook URL override for pull request notifications.
    required: false
  pull-request-thread-id:
    description: Discord thread ID override for pull request notifications.
    required: false
  issue-webhook-url:
    description: Discord webhook URL override for issue notifications.
    required: false
  issue-thread-id:
    description: Discord thread ID override for issue notifications.
    required: false
  skip-bots:
    description: Skip activity performed by bot accounts.
    required: false
    default: "true"
  anon-keyword:
    description: Commit-body keyword that fully anonymizes a commit.
    required: false
    default: "!anon"
  silent-keyword:
    description: Commit-body keyword that omits a commit from notifications.
    required: false
    default: "!silent"
  branch-allowlist:
    description: Comma-separated pushed branch names to include in notifications.
    required: false
  branch-denylist:
    description: Comma-separated pushed branch names to exclude from notifications.
    required: false
  pull-request-actions:
    description: Comma-separated pull request lifecycle actions to notify for.
    required: false
    default: opened,reopened,converted_to_draft,ready_for_review,closed
  issue-actions:
    description: Comma-separated issue lifecycle actions to notify for.
    required: false
    default: opened,reopened,closed
  pull-request-drafts:
    description: Include or exclude notifications while a pull request is a draft.
    required: false
    default: include
  pull-request-base-allowlist:
    description: Comma-separated target branch patterns to include for pull requests.
    required: false
  pull-request-base-denylist:
    description: Comma-separated target branch patterns to exclude for pull requests.
    required: false
  pull-request-head-allowlist:
    description: Comma-separated source branch patterns to include for pull requests.
    required: false
  pull-request-head-denylist:
    description: Comma-separated source branch patterns to exclude for pull requests.
    required: false
  pull-request-label-allowlist:
    description: Require at least one of these comma-separated pull request labels.
    required: false
  pull-request-label-denylist:
    description: Skip pull requests with any of these comma-separated labels.
    required: false
  issue-label-allowlist:
    description: Require at least one of these comma-separated issue labels.
    required: false
  issue-label-denylist:
    description: Skip issues with any of these comma-separated labels.
    required: false
  pull-request-details:
    description: Comma-separated pull request card details to show.
    required: false
    default: body,labels,reviewers,assignees,stats
  issue-details:
    description: Comma-separated issue card details to show.
    required: false
    default: body,type,labels,assignees,milestone
  body-max-length:
    description: Maximum pull request or issue body excerpt length from 0 to 1000.
    required: false
    default: "320"
  pull-request-size-thresholds:
    description: Three ascending changed-line thresholds for S, M, L, and XL pull request badges.
    required: false
    default: 100,500,1000
  highlight-first-time-contributors:
    description: Highlight pull requests and issues from first-time contributors.
    required: false
    default: "true"
  event-colors:
    description: Per-state activity colors as event.action=#RRGGBB entries separated by commas or newlines.
    required: false
  label-color-priority:
    description: Ordered labels whose GitHub color takes priority for pull request and issue cards.
    required: false
  redact-labels:
    description: Fully redact pull requests and issues carrying any of these labels.
    required: false
  accent-color:
    description: Fallback Discord accent color as #RRGGBB or RRGGBB; branch, label, and event colors take priority.
    required: false
  use-sender-avatar:
    description: Use the event sender's GitHub avatar as the webhook avatar.
    required: false
    default: "true"
  use-repo-username:
    description: Use the repository name as the webhook username.
    required: false
    default: "true"
  repo-name:
    description: Override the repository label and webhook username.
    required: false
  hide-links:
    description: Remove GitHub links and action buttons from notifications.
    required: false
    default: "false"
  compact-mode:
    description: Condense push commits and omit secondary pull request or issue details.
    required: false
    default: "false"
  branch-colors:
    description: Per-branch accent colors as pattern=#RRGGBB entries separated by commas or newlines.
    required: false
  name-anon-users:
    description: Comma-separated GitHub usernames shown as Anonymous while activity details remain visible.
    required: false
  full-anon-users:
    description: Comma-separated GitHub usernames whose commits, pull requests, or issues are fully redacted.
    required: false

runs:
  using: node24
  main: dist/index.js
