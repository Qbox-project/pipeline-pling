# act-only: default inputs scenario for issues (not intended for real repository notifications)
name: Discord Issue Notification

on:
  issues:
    types: [opened, closed]

jobs:
  notify:
    # The issues event has no branch filter, so this guard is what keeps the
    # workflow from posting on real repository activity. act sets ACT=true.
    if: ${{ env.ACT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Discord
        uses: ./
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          thread-id: ${{ vars.DISCORD_THREAD_ID }}
